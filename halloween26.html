<style>
/* Layout: walking simulator a pantalla completa; HUD mínimo en las esquinas, la lectura se abre como nota de juego */
:root{
  --noche:#07040a;
  --hueso:#f4f1e6;
  --calabaza:#ff7a1a;
  --moco:#c6e85a;
  --pizarra:#1f3a2e;
  --pizarra-2:#22412f;
  --tinta:#140b12;
  --f-display:"Rubik Wet Paint","Impact",fantasy;
  --f-maquina:"Special Elite","Courier New",monospace;
  --f-tiza:"Patrick Hand","Comic Sans MS",cursive;
  --f-body:"Bricolage Grotesque",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--noche);color:var(--hueso);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;z-index:3}
.plate{font-family:var(--f-maquina);background:#000000b0;border:2px solid #000;box-shadow:3px 3px 0 var(--calabaza);padding:7px 11px;min-width:0}
.plate .set{font-size:clamp(11px,1.7vmin,14px);text-transform:uppercase;letter-spacing:.08em}
.plate .esc{font-size:clamp(10px,1.4vmin,12px);color:var(--calabaza);margin-top:2px}
.prog{display:flex;gap:4px;margin-top:6px}
.prog span{width:16px;height:5px;background:#ffffff30}
.prog span.on{background:var(--moco)}
#mapa{background:#000000b0;border:2px solid #000;box-shadow:3px 3px 0 var(--calabaza);display:block;flex:none}
#hint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--f-maquina);font-size:clamp(11px,1.6vmin,14px);color:var(--hueso);background:#000000a0;padding:6px 12px;white-space:nowrap;pointer-events:none;z-index:3;transition:opacity .4s;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--hueso);color:var(--tinta);font-family:var(--f-maquina);font-size:clamp(13px,1.9vmin,16px);padding:11px 15px;border:3px solid #000;box-shadow:5px 5px 0 var(--calabaza);max-width:min(440px,calc(100vw - 32px));text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:4}
#toast.on{opacity:1;transform:translate(-50%,0)}
#wa{position:fixed;z-index:2;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
#wa:focus-visible{outline:3px dashed var(--moco)}

/* Nota de lectura (la pizarra de cerca) */
#note{position:fixed;inset:0;z-index:5;background:#000000c8;display:flex;align-items:center;justify-content:center;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));cursor:pointer;opacity:0;transition:opacity .25s;pointer-events:none}
#note.on{opacity:1;pointer-events:auto}
.slate{position:relative;width:min(680px,100%);max-height:100%;overflow:auto;background:var(--pizarra);color:var(--hueso);border:14px solid #5a3a22;outline:3px solid #000;box-shadow:8px 8px 0 #000,0 0 0 4px var(--calabaza);padding:clamp(18px,4vw,34px);font-family:var(--f-tiza);font-size:clamp(17px,2.3vw,21px);line-height:1.45;
  background-image:radial-gradient(ellipse 40% 30% at 20% 30%,var(--pizarra-2) 99%,transparent 100%),radial-gradient(ellipse 35% 25% at 80% 75%,var(--pizarra-2) 99%,transparent 100%);transform:scale(.94);transition:transform .25s}
#note.on .slate{transform:scale(1)}
.slate h2{font-family:var(--f-display);font-weight:400;color:var(--calabaza);font-size:clamp(2rem,6vw,2.9rem);line-height:1;margin:0 0 .45em;text-wrap:balance}
.slate p{margin:0 0 .75em;max-width:62ch}
.slate strong{color:var(--moco);font-weight:400}
.eyebrow{font-family:var(--f-maquina);text-transform:uppercase;letter-spacing:.14em;font-size:.68em;color:var(--calabaza);margin-bottom:.5em}
.cerrar{font-family:var(--f-maquina);font-size:.68em;opacity:.7;margin-top:1.2em;text-transform:uppercase;letter-spacing:.1em}
.hero{text-align:center}
.titulo{font-family:var(--f-display);font-weight:400;line-height:.88;margin:0;font-size:clamp(2.6rem,10vw,4.4rem);text-shadow:3px 3px 0 var(--calabaza)}
.titulo span{display:block;color:var(--moco);text-shadow:3px 3px 0 #5a2a5e}
.hero img{height:min(34vh,280px);width:auto;margin:10px auto 4px;display:block;filter:drop-shadow(6px 6px 0 #000)}
.credito{font-family:var(--f-body);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.8em}
.credito em{font-style:normal;color:var(--calabaza)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px;margin-bottom:1em}
.kv div{min-width:0}
.lbl{font-family:var(--f-maquina);text-transform:uppercase;letter-spacing:.12em;font-size:.62em;color:var(--calabaza)}
.val{font-size:1.25em;line-height:1.15}
.val small{display:block;font-size:.7em;opacity:.75}
.cuenta{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-family:var(--f-display);color:var(--moco);font-size:1.9em;line-height:1}
.cuenta i{display:block;font-style:normal;font-family:var(--f-maquina);font-size:.32em;color:var(--hueso);opacity:.75;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.reglas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6em}
.reglas li{display:grid;grid-template-columns:1.6em 1fr;gap:.5em}
.reglas b{font-family:var(--f-display);font-weight:400;font-size:1.5em;line-height:1;color:var(--moco)}
.reglas .gorda{text-transform:uppercase;color:var(--calabaza)}
.papel{border:2px dashed var(--hueso);padding:12px 14px;margin:0 0 1em}
.papel .rol{font-size:1.35em;line-height:1.15;color:var(--moco)}
.sello{display:inline-block;margin-top:1em;font-family:var(--f-maquina);text-transform:uppercase;letter-spacing:.1em;border:3px solid var(--calabaza);color:var(--calabaza);padding:6px 12px;transform:rotate(-4deg);font-size:.72em}

#loading{position:fixed;inset:0;z-index:9;background:var(--noche);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#loading .t{font-family:var(--f-display);font-size:clamp(2.4rem,9vw,4.4rem);line-height:.9;text-shadow:3px 3px 0 var(--calabaza)}
#loading .t span{display:block;color:var(--moco)}
#loading .s{font-family:var(--f-maquina);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--calabaza)}
#loading.off{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#note,.slate,#toast{transition:none}}
</style>

var DOG_SPOTS=[
  {k:"f",hide:V(3.8,0,-6.6),peek:V(2.9,0,-6.6),ry:0,lean:.18},
  {k:"l",hide:V(-4.6,0,-5.8),peek:V(-4.6,0,-4.6),ry:Math.PI/2,lean:-.18},
  {k:"r",hide:V(4.6,0,-5.8),peek:V(4.6,0,-4.6),ry:-Math.PI/2,lean:.18}

function updateDog(dt){
  if(!dog||!current)return;
  if((state!=="idle"&&state!=="board")||G.ghostOn){dog.g.visible=false;if(dog.phase!=="wait"){dog.phase="wait";dog.t=0}return}
  dog.t+=dt;
  var s=dog.spot;
  if(dog.phase==="wait"){dog.g.visible=false;if(dog.t>1.3){dog.spot=s=DOG_SPOTS[dog.i%3];dog.i++;dog.phase="out";dog.t=0;if(dog.g.parent!==current.g)current.g.add(dog.g);dog.g.rotation.y=s.ry;dog.g.visible=true}}
  if(!s)return;
  var u;
  if(dog.phase==="out"){u=Math.min(1,dog.t/.55);u=1-Math.pow(1-u,3);if(dog.t>=.55){dog.phase="hold";dog.t=0}}
  else if(dog.phase==="hold"){u=1;if(dog.t>2.2){dog.phase="in";dog.t=0}}
  else if(dog.phase==="in"){u=1-Math.min(1,dog.t/.45);if(dog.t>=.45){dog.phase="wait";dog.t=0}}
  else u=0;
  dog.g.position.lerpVectors(s.hide,s.peek,u);
  var inner=dog.g.userData.inner;inner.rotation.z=s.lean*u+Math.sin(clock.elapsedTime*3)*.03*u;
  inner.position.y=dog.hop>0?Math.sin(dog.hop*Math.PI)*.25:0;if(dog.hop>0)dog.hop=Math.max(0,dog.hop-dt*2.5);

var cells={},visitOrder=0,extraN=0,pos={x:0,y:0},heading=0; // heading 0=N,1=E,2=S,3=W
var DXY=[[0,-1],[1,0],[0,1],[-1,0]];
function key(x,y){return x+","+y}
function cellAt(x,y){
  var k=key(x,y);if(cells[k])return cells[k];
  var n=visitOrder++,c;
  if(n<SECCIONES.length)c={tId:n,sec:SECCIONES[n]};else{c={tId:n%5,sec:"extra",extra:extraN++}}
  cells[k]=c;return c;
}

function toWorld(fr,p){var c=Math.cos(fr.yaw),s=Math.sin(fr.yaw);return V(p.x*c+p.z*s+fr.o.x,p.y+fr.o.y,-p.x*s+p.z*c+fr.o.z)}
function frameFor(from,dir){
  var yaw=from.yaw+(dir==="l"?Math.PI/2:dir==="r"?-Math.PI/2:0);
  var outer=dir==="f"?V(DOOR.N.x,0,-HL-TH/2):dir==="l"?V(-HW-TH/2,0,DOOR.W.z):V(HW+TH/2,0,DOOR.E.z);
  var w=toWorld(from,outer),c=Math.cos(yaw),s=Math.sin(yaw),p=V(DOOR.S.x,0,HL+TH/2);
  return {o:V(w.x-(p.x*c+p.z*s),0,w.z-(-p.x*s+p.z*c)),yaw:yaw};
}

/* Cámara */
var cam={pos:V(0,0,0),yaw:0,look:0,pitch:0,tLook:0,tPitch:0,drag:0,bob:0};
var path=null;
function run(points,speed){var L=[0];for(var i=1;i<points.length;i++)L.push(L[i-1]+points[i].distanceTo(points[i-1]));return{type:"run",pts:points,L:L,total:L[L.length-1],dur:L[L.length-1]/speed+.35,t:0}}
function turn(to,dur){return{type:"turn",from:null,to:to,dur:dur,t:0}}
function stepPath(dt){
  var seg=path.segs[path.i];if(!seg){var cb=path.done;path=null;cb&&cb();return}
  seg.t+=dt;var u=Math.min(1,seg.t/seg.dur);
  if(seg.type==="run"){
    var e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,d=e*seg.total,i=1;while(i<seg.L.length-1&&seg.L[i]<d)i++;
    var a=seg.pts[i-1],b=seg.pts[i],f=(d-seg.L[i-1])/Math.max(1e-6,seg.L[i]-seg.L[i-1]);
    cam.pos.lerpVectors(a,b,Math.min(1,Math.max(0,f)));cam.bob=reduce?0:Math.sin(d*4.4)*.045;
  }else{if(seg.from===null)seg.from=cam.yaw;var e2=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;cam.yaw=seg.from+(seg.to-seg.from)*e2;cam.bob=0}
  if(u>=1)path.i++;
}

function mover(dir){
  if(state!=="idle"&&state!=="board")return;
  setHover(null);
  var dIdx=dir==="f"?heading:dir==="l"?(heading+3)%4:(heading+1)%4;
  var nx=pos.x+DXY[dIdx][0],ny=pos.y+DXY[dIdx][1];
  var cell=cellAt(nx,ny),fr=frameFor(current.frame,dir);
  var next=buildRoom(cell,fr);
  var A=current.frame,segs,speed=4.4;
  var stB=toWorld(fr,STAND);
  if(dir==="f"){
    segs=[run([cam.pos.clone(),toWorld(A,V(DOOR.N.x,1.6,-4.6)),toWorld(A,V(DOOR.N.x,1.6,-HL-TH/2)),stB],speed)];
  }else{
    var side=dir==="l"?-1:1;
    segs=[run([cam.pos.clone(),toWorld(A,V(STAND.x,1.6,DOOR.W.z))],speed),turn(A.yaw+(dir==="l"?Math.PI/2:-Math.PI/2),.7),
      run([toWorld(A,V(STAND.x,1.6,DOOR.W.z)),toWorld(A,V(side*(HW+TH/2),1.6,DOOR.W.z)),stB],speed)];
  }
  state="walk";hint("");
  if(dog){dog.g.visible=false;dog.phase="wait";dog.t=0}
  path={segs:segs,i:0,done:function(){
    var old=current;current=next;cam.yaw=fr.yaw;cam.pos.copy(stB);
    if(dog&&dog.g.parent)dog.g.parent.remove(dog.g);
    disposeRoom(old);heading=dIdx;pos.x=nx;pos.y=ny;state="idle";hud();hint("");
    if(current.sec==="prueba")toast("Has llegado a la oficina de casting.");
  }};
}

}
var tt;
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){el.classList.remove("on")},3000)}

/* ---------- Entrada ---------- */
var ray=new T.Raycaster(),ndc=new T.Vector2();
function pickAt(x,y){
  if(!current)return null;
  ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  var targets=[current.g];if(dog&&dog.g.visible&&dog.phase!=="wait")targets.push(dog.g);
  var hits=ray.intersectObjects(targets,true);
  for(var i=0;i<hits.length;i++){var o=hits[i].object;if(o.isSprite||o.isLine||o.isLineSegments)continue;
    while(o){if(o.userData&&o.userData.pick)return o;o=o.parent}
    if(hits[i].object.material!==INVIS&&!hits[i].object.userData.hull)return null}
  return null;
}
/* Hover: contorno fijo, blanco y el doble de grueso */
var hovered=null;
function styleHover(r,on){
  if(dog&&r===dog.g){r.userData.o.visible=!on;r.userData.oh.visible=on;return}
  (r.userData.hulls||[]).forEach(function(h){h.material=on?HOVER:HOT;h.scale.copy(on?h.userData.kB:h.userData.kA);h.position.copy(on?h.userData.pB:h.userData.pA)});
}
function setHover(r){if(r===hovered)return;if(hovered)styleHover(hovered,false);hovered=r;if(r)styleHover(r,true);canvas.style.cursor=r?"pointer":"default"}
/* Acercarse a la pizarra */
function boardTarget(){
  var b=current.bd,vf=camera.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);
  var d=Math.max(b.w/2*1.07/Math.tan(hf/2),b.h/2*1.1/Math.tan(vf/2));d=Math.min(d,9);
  return toWorld(current.frame,V(b.cx,b.cy,-HL+TH/2+.125+d));
}
function focusBoard(){
  if(state!=="idle")return;setHover(null);state="walk";hint("");
  path={segs:[run([cam.pos.clone(),boardTarget()],3.4)],i:0,done:function(){state="board";hint("Toca otra vez para volver · las puertas siguen funcionando")}};
}
function unfocus(){
  if(state!=="board")return;setHover(null);state="walk";hint("");
  path={segs:[run([cam.pos.clone(),toWorld(current.frame,STAND)],3.4)],i:0,done:function(){state="idle"}};
}
function hint(s){var h=$("hint");if(s){h.textContent=s;h.style.opacity=1}else h.style.opacity=0}
var fi=0;
function activar(r){
  if(state!=="idle"&&state!=="board")return;
  var p=r&&r.userData.pick;
  if(!p){if(state==="board")unfocus();return}
  if(p.kind==="door")mover(p.dir);
  else if(p.kind==="board"){state==="board"?unfocus():focusBoard()}
  else if(p.kind==="prop")toast(p.msg);
  else if(p.kind==="dog"){toast(FRASES[fi%FRASES.length]);fi++;dog.hop=1;dog.t=0}
}
var down=null;
canvas.addEventListener("pointerdown",function(e){down={x:e.clientX,y:e.clientY,l:cam.drag,moved:false,type:e.pointerType};try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener("pointermove",function(e){
  if(e.pointerType==="mouse"){cam.tLook=-(e.clientX/innerWidth-.5)*2*.16;cam.tPitch=-(e.clientY/innerHeight-.5)*2*.07;hoverAt(e.clientX,e.clientY)}
  if(down&&e.pointerType!=="mouse"){var dx=e.clientX-down.x;if(Math.abs(dx)>8)down.moved=true;cam.drag=Math.max(-.55,Math.min(.55,down.l+dx*.004))}
});
canvas.addEventListener("pointerup",function(e){if(!down)return;var d=Math.hypot(e.clientX-down.x,e.clientY-down.y);var wasDrag=down.moved;down=null;if(d<10&&!wasDrag)activar(pickAt(e.clientX,e.clientY))});
canvas.addEventListener("pointercancel",function(){down=null});
canvas.addEventListener("pointerleave",function(){setHover(null)});
var lastHover=0,hoverXY=null;
function hoverAt(x,y){hoverXY=[x,y];var n=performance.now();if(n-lastHover<60)return;lastHover=n;
  setHover((state==="idle"||state==="board")?pickAt(x,y):null)}
addEventListener("keydown",function(e){
  var m={ArrowUp:"f",w:"f",ArrowLeft:"l",a:"l",ArrowRight:"r",d:"r"}[e.key];
  if(m){e.preventDefault();mover(m)}
  if(e.key==="Enter"||e.key===" "){e.preventDefault();state==="board"?unfocus():focusBoard()}
  if(e.key==="Escape")unfocus();
});

/* ---------- Apagones ---------- */
var G={next:4+Math.random()*4,q:[],exp:1,ghostOn:false,ga:0};
function planGlitch(){
  var q=[],n=2+Math.floor(Math.random()*5);
  for(var i=0;i<n;i++){q.push({d:.04+Math.random()*.09,e:.06+Math.random()*.3});q.push({d:.05+Math.random()*.14,e:.75+Math.random()*.25})}
  if(Math.random()<.55){
    q.push({d:1.2+Math.random()*1.8,e:.045,ghost:Math.random()<.6});
    q.push({d:.07,e:.55},{d:.09,e:.06},{d:.12,e:.9});
  }
  G.q=q;
}
function updGlitch(dt,t){
  if(!G.q.length){G.exp=1;G.ghostOn=false;G.next-=dt;if(G.next<=0){planGlitch();G.next=6+Math.random()*10}}
  else{var s=G.q[0];if(s.t==null){s.t=0;if(s.ghost&&ghost){var gz=-1.2-Math.random()*.4,ga=Math.tan(camera.fov*Math.PI/360)*-gz;ghost.position.set((Math.random()<.5?-1:1)*ga*camera.aspect*(.45+Math.random()*.3),-ga*(.25+Math.random()*.25),gz);ghost.rotation.z=(Math.random()-.5)*.25}}
    s.t+=dt;G.exp=s.e;G.ghostOn=!!s.ghost;if(s.t>=s.d)G.q.shift()}
  renderer.toneMappingExposure=G.exp;
  if(ghost){G.ga+=((G.ghostOn?.42:0)-G.ga)*Math.min(1,dt*(G.ghostOn?3:9));ghost.material.opacity=G.ga;ghost.visible=G.ga>.01;
    if(ghost.visible){ghost.position.x+=Math.sin(t*1.7)*.0008;ghost.position.y+=Math.sin(t*1.1)*.0006}}
}

/* Enlace de WhatsApp colocado sobre la claqueta */
var box3=new T.Box3(),corner=new T.Vector3();
function placeWA(){
  var a=$("wa");
  if(!current||!current.claq||state!=="idle"){a.hidden=true;return}
  box3.setFromObject(current.claq);var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9,behind=false;
  for(var i=0;i<8;i++){corner.set(i&1?box3.max.x:box3.min.x,i&2?box3.max.y:box3.min.y,i&4?box3.max.z:box3.min.z).project(camera);if(corner.z>1)behind=true;
    var sx=(corner.x+1)/2*innerWidth,sy=(1-corner.y)/2*innerHeight;minx=Math.min(minx,sx);maxx=Math.max(maxx,sx);miny=Math.min(miny,sy);maxy=Math.max(maxy,sy)}
  if(behind||maxx<0||minx>innerWidth){a.hidden=true;return}
  a.hidden=false;a.style.left=minx+"px";a.style.top=miny+"px";a.style.width=(maxx-minx)+"px";a.style.height=(maxy-miny)+"px";
}

/* ---------- Bucle ---------- */
var lastCount=0,perf={n:0,acc:0,low:false};
function frame(){
  requestAnimationFrame(frame);
  var raw=clock.getDelta(),dt=Math.min(.05,raw),t=clock.elapsedTime;
  if(!perf.low){perf.n++;perf.acc+=raw;if(perf.n>=90){if(perf.acc/perf.n>.04){perf.low=true;renderer.setPixelRatio(1);resize()}perf.n=0;perf.acc=0}}
  blink=.35+.65*(.5+.5*Math.sin(t*5.5));HOT.opacity=blink;
  if(path)stepPath(dt);
  if(!down||down.type==="mouse")cam.drag*=Math.pow(.25,dt);
  cam.look+=(cam.tLook-cam.look)*Math.min(1,dt*4);cam.pitch+=(cam.tPitch-cam.pitch)*Math.min(1,dt*4);
  var walking=state==="walk"||state==="intro";
  camera.position.set(cam.pos.x,cam.pos.y+cam.bob+(walking?0:Math.sin(t*1.3)*.012),cam.pos.z);
  camera.rotation.y=cam.yaw+(walking?cam.look*.3:cam.look+cam.drag);camera.rotation.x=cam.pitch*(walking?.3:1);
  FLAMES.forEach(function(f){var k=1+Math.sin(t*14+f.ph)*.12+Math.sin(t*23+f.ph*2)*.08;f.o.scale.set(.045,.11*k,.045);f.i.scale.set(.025,.06*k,.025)});
  ROOMS.forEach(function(r){
    r.smoke.forEach(function(s){var v=s.userData.v;s.position.x+=v.x*dt;s.position.z+=v.z*dt;s.position.y+=Math.sin(t*.6+s.userData.ph)*.002;
      if(Math.abs(s.position.x)>HW-.4)v.x*=-1;if(Math.abs(s.position.z)>HL-.4)v.z*=-1});
    r.flick.forEach(function(L,i){L.intensity=.75+Math.sin(t*11+i*3)*.12+Math.sin(t*27+i)*.08});
    r.bubbles.forEach(function(b){var u=(t*.7+b.userData.bub)%1;b.position.y=.6+u*.12;b.scale.setScalar(.03+u*.05)});
    r.risers.forEach(function(s){var u=(t*.25+s.userData.rise)%1;s.position.y=.9+u*1.6;s.material.opacity=.35*(1-u);var sc=.5+u*1.2;s.scale.set(sc,sc,1)});
    r.bobs.forEach(function(o){o.position.y=o.userData.bob.base+Math.sin(t*o.userData.bob.sp)*o.userData.bob.amp});
    if(r.clap){var c=(t%4.5);r.clap.rotation.z=c<.25?(c<.12?c/.12*.45:.45*(1-(c-.12)/.13)):0}
  });
  updateDog(dt);updGlitch(dt,t);
  if(hovered&&hoverXY&&state!=="walk"&&!hovered.parent)setHover(null);
  if(current&&current.sec==="ficha"&&Math.floor(t)!==lastCount){lastCount=Math.floor(t);drawBoard(current)}
  renderer.render(scene,camera);
  placeWA();
}

/* ---------- Arranque ---------- */
function start(){
  scene.add(camera);
  redrawTexs();ray.params.Line.threshold=.01;
  var c0=cellAt(0,0);
  current=buildRoom(c0,{o:V(0,0,0),yaw:0});
  if(dogImg)makeDog();
  cam.pos.set(STAND.x,1.6,HL+2.2);cam.yaw=0;hud();
  path={segs:[run([cam.pos.clone(),STAND.clone()],2.2)],i:0,done:function(){state="idle";setTimeout(function(){toast("Toca una puerta para avanzar. Arrastra o mueve el ratón para mirar.")},500)}};
  $("loading").classList.add("off");canvas.focus();
  frame();
}
var img=new Image();
var fontsReady=(document.fonts&&document.fonts.load)?Promise.all(["100px 'Rubik Wet Paint'","40px 'Special Elite'","40px 'Patrick Hand'","800 40px 'Bricolage Grotesque'"].map(function(f){return document.fonts.load(f)})).catch(function(){}):Promise.resolve();
var imgReady=new Promise(function(res){img.onload=function(){dogImg=img;res()};img.onerror=res;img.src=DOG_SRC});
var started=false;
function go(){if(started)return;started=true;start()}
Promise.all([fontsReady,imgReady]).then(go);setTimeout(function(){if(dogImg)go()},4000);
})();
</script>
